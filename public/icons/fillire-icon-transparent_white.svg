<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Geometric F built from overlapping angled bars, offset for depth -->
  <g fill="white">
    <!-- Top bar: angled hexagon -->
    <polygon points="110,95 280,95 250,150 140,150 110,95" />

    <!-- Middle bar: shorter, offset right -->
    <polygon points="110,185 230,185 205,240 135,240" />

    <!-- Vertical connector: slim angled stem tying bars together -->
    <polygon points="110,95 155,95 135,305 90,305" />
  </g>
</svg>
